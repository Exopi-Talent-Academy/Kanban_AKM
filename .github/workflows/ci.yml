name: Build and test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Kanban_AKM.Tests/Kanban_AKM.Tests.csproj

      - name: Build
        run: dotnet build tests/Kanban_AKM.Tests/Kanban_AKM.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Kanban_AKM.Tests/Kanban_AKM.Tests.csproj --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
